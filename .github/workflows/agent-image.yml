name: Agent image

# Publishes runtime/agent as ghcr.io/<owner>/agent:<version> and runtime/claude-login (the instance's sign-in
# container) as ghcr.io/<owner>/claude-login:<version>. Instances copy the agent image into each account that runs
# projects, and the operator copies the sign-in image into the instance's account (see docs/self-hosting.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image tag for both images (defaults to the version in each package.json)
        required: false
  push:
    tags: ['agent-v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bohr/agent build
      - run: pnpm --filter @bohr/claude-login build
      - id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          agent="${{ inputs.version }}"
          login="${{ inputs.version }}"
          if [ -z "$agent" ]; then agent="$(node -p "require('./runtime/agent/package.json').version")"; fi
          if [ -z "$login" ]; then login="$(node -p "require('./runtime/claude-login/package.json').version")"; fi
          echo "image=ghcr.io/${owner}/agent:${agent}" >> "$GITHUB_OUTPUT"
          echo "login_image=ghcr.io/${owner}/claude-login:${login}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/claude-login/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.login_image }}
